sections:
  - heading: Summary
    body: >
      Engineering leader and former CTO with 13+ years of experience architecting
      and scaling high-traffic content and e-commerce platforms on AWS. Led
      engineering teams of up to 10 and directed technology for a 30+ site
      portfolio serving millions of monthly users. Delivers sub-second page
      loads through multi-layer caching, maintains a disciplined weekly release
      cadence with minimal production incidents, and applies AI across code
      review, development, testing and design. Hands-on expertise in React,
      TypeScript, Node.js, PHP and serverless AWS.

