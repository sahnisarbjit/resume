name: Resume Builder

on:
  push:
    branches: [ "main" ]
    paths:
      - "resume.yaml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fpdf2 pyyaml
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Build
      run: python3 build_resume.py
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        short_sha="${GITHUB_SHA::7}"
        pdf=$(printf '%s\n' Resume\ -\ *.pdf)
        gh release create "resume-${short_sha}" "$pdf" \
          --repo "$GITHUB_REPOSITORY" \
          --title "Resume ${short_sha}" \
          --notes "Generated from resume.yaml at ${GITHUB_SHA}."
