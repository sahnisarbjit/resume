name: Resume Builder

on:
  push:
    branches: [ "main" ]
    paths:
      - "resume.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build
      run: python3 build_resume.py
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        pdf=$(printf '%s\n' Resume-*.pdf)
        run_number="${{ github.run_number }}"
        gh release create "resume-${run_number}" "$pdf" \
          --repo "$GITHUB_REPOSITORY" \
          --title "Resume (#${run_number})" \
          --notes "Generated from resume.yaml at ${GITHUB_SHA}."
